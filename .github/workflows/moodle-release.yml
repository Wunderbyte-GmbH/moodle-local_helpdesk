#
# Whenever a new tag starting with "v" is pushed, add the tagged version
# to the Moodle Plugins directory at https://moodle.org/plugins
#
# The ZIP that GitHub builds for a tag has the root directory "moodle-local_helpdesk-<tag>",
# which Moodle refuses to install from ("rootdirinvalid"): the root directory has to be the
# plugin name, "helpdesk". So the package is built here with "git archive", which also leaves
# out everything marked export-ignore in .gitattributes, attached to a GitHub release, and
# that file is what the Plugins directory receives.
#
name: Releasing in the Plugins directory

on:
  push:
    tags:
      - v*

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  release-at-moodle-org:
    runs-on: ubuntu-latest
    env:
      PLUGIN: local_helpdesk
      ROOTDIR: helpdesk
      CURL: curl -s
      ENDPOINT: https://moodle.org/webservice/rest/server.php
      TOKEN: ${{ secrets.MOODLE_ORG_TOKEN }}
      FUNCTION: local_plugins_add_version
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Determine the tag
        id: tag
        run: |
          if [[ ! -z "${{ github.event.inputs.tag }}" ]]; then
            TAGNAME="${{ github.event.inputs.tag }}"
          elif [[ $GITHUB_REF = refs/tags/* ]]; then
            TAGNAME="${GITHUB_REF##*/}"
          fi
          if [[ -z "${TAGNAME}" ]]; then
            echo "No tag name has been provided!"
            exit 1
          fi
          echo "name=${TAGNAME}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Build the package
        id: package
        env:
          TAGNAME: ${{ steps.tag.outputs.name }}
        run: |
          ZIPNAME="${PLUGIN}_${TAGNAME}.zip"
          git archive --format=zip --prefix="${ROOTDIR}/" -o "${ZIPNAME}" "${TAGNAME}"
          # Fail early if the package would be refused: one root directory, named like the plugin.
          ROOTS=$(unzip -Z1 "${ZIPNAME}" | cut -d/ -f1 | sort -u)
          if [[ "${ROOTS}" != "${ROOTDIR}" ]]; then
            echo "Unexpected root directories in ${ZIPNAME}: ${ROOTS}"
            exit 1
          fi
          unzip -l "${ZIPNAME}" "${ROOTDIR}/version.php" > /dev/null
          echo "zipname=${ZIPNAME}" >> "$GITHUB_OUTPUT"

      - name: Attach the package to a GitHub release
        id: release
        env:
          TAGNAME: ${{ steps.tag.outputs.name }}
          ZIPNAME: ${{ steps.package.outputs.zipname }}
        run: |
          if gh release view "${TAGNAME}" > /dev/null 2>&1; then
            gh release upload "${TAGNAME}" "${ZIPNAME}" --clobber
          else
            gh release create "${TAGNAME}" "${ZIPNAME}" --title "${TAGNAME}" --notes "See CHANGES.md for what changed." --verify-tag
          fi
          ZIPURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAGNAME}/${ZIPNAME}"
          echo "zipurl=${ZIPURL}" >> "$GITHUB_OUTPUT"

      - name: Call the service function
        id: add-version
        env:
          TAGNAME: ${{ steps.tag.outputs.name }}
          ZIPURL: ${{ steps.release.outputs.zipurl }}
        run: |
          RESPONSE=$(${CURL} ${ENDPOINT} --data-urlencode "wstoken=${TOKEN}" \
                                         --data-urlencode "wsfunction=${FUNCTION}" \
                                         --data-urlencode "moodlewsrestformat=json" \
                                         --data-urlencode "frankenstyle=${PLUGIN}" \
                                         --data-urlencode "zipurl=${ZIPURL}" \
                                         --data-urlencode "vcssystem=git" \
                                         --data-urlencode "vcsrepositoryurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                                         --data-urlencode "vcstag=${TAGNAME}" \
                                         --data-urlencode "changelogurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAGNAME}/CHANGES.md" \
                                         --data-urlencode "altdownloadurl=${ZIPURL}")
          echo "response=${RESPONSE}" >> "$GITHUB_OUTPUT"

      - name: Evaluate the response
        id: evaluate-response
        env:
          RESPONSE: ${{ steps.add-version.outputs.response }}
        run: |
          jq <<< ${RESPONSE}
          jq --exit-status ".id" <<< ${RESPONSE} > /dev/null
